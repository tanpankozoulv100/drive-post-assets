<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>TikTok 連携コード</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { color-scheme: dark; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif;
         margin: 0; min-height: 100vh; display: grid; place-items: center;
         background: #111; color: #eee; }
  main { width: min(560px, 90vw); text-align: center; }
  h1 { font-size: 1.15rem; font-weight: 600; margin-bottom: .4rem; }
  p  { color: #9a9a9a; font-size: .9rem; line-height: 1.8; margin: 0 0 1.4rem; }
  textarea { width: 100%; height: 7rem; padding: .9rem; box-sizing: border-box;
             background: #1c1c1c; color: #eee; border: 1px solid #333;
             border-radius: 10px; font-family: ui-monospace, SFMono-Regular, monospace;
             font-size: .85rem; resize: vertical; }
  button { margin-top: .9rem; padding: .7rem 1.6rem; border: 0; border-radius: 999px;
           background: #fe2c55; color: #fff; font-size: .95rem; font-weight: 600; }
  .done { color: #4ade80; font-size: .85rem; min-height: 1.3rem; margin-top: .7rem; }
  .error { color: #f87171; }
</style>
</head>
<body>
<main>
  <h1>連携コードを受け取りました</h1>
  <p>下の枠の中身をすべてコピーして、Cursor のチャットに貼り付けてください。<br>
     このコードは数分で使えなくなります。</p>
  <textarea id="out" readonly></textarea>
  <button id="copy">コピーする</button>
  <div class="done" id="done"></div>
</main>
<script>
  const params = new URLSearchParams(location.search);
  const out = document.getElementById("out");
  const done = document.getElementById("done");
  if (params.get("error")) {
    out.value = "エラー: " + params.get("error") + " / " + (params.get("error_description") || "");
    done.textContent = "連携が中断されました。もう一度お試しください。";
    done.className = "done error";
  } else if (params.get("code")) {
    out.value = location.href;
  } else {
    out.value = "コードが見つかりません。認可のリンクからもう一度開いてください。";
  }
  document.getElementById("copy").onclick = async () => {
    out.select();
    try { await navigator.clipboard.writeText(out.value); }
    catch (e) { document.execCommand("copy"); }
    done.textContent = "コピーしました。Cursor に貼り付けてください。";
    done.className = "done";
  };
</script>
</body>
</html>
